     <!--Linkedin, 2023-->
     <!--the code below is the calculations of the coursesFees-->
    <script>  
        const courseFees = {
            firstAid: 1500,
            sewing: 1500,
            landscaping: 1500,
            lifeSkills: 1500,
            childMinding: 750,
            cooking: 750,
            gardenMaintenance: 750,
        };

        const selectedCourses = {};

        function updateCourseCost(courseId) {
            const courseCostElement = document.getElementById(courseId + "Cost");
            const courseFee = courseFees[courseId];

            if (selectedCourses[courseId]) {
                courseCostElement.textContent = `Cost: R${courseFee}`;
            } else {
                courseCostElement.textContent = "";
            }
        }

        function calculateTotal() {
            const totalInput = document.getElementById("total");
            const discountInfo = document.getElementById("discountInfo");
            const bankInfo = document.getElementById("bankInfo");

            const courseCheckboxes = document.querySelectorAll("input[type='checkbox']");

            let totalFee = 0;

            courseCheckboxes.forEach(checkbox => {
                const courseId = checkbox.id;
                if (checkbox.checked) {
                    selectedCourses[courseId] = true;
                    totalFee += courseFees[courseId];
                } else {
                    delete selectedCourses[courseId];
                }

                updateCourseCost(courseId);
            });

            totalInput.value = "R" + totalFee.toFixed(2);

            // Apply discounts based on the number of selected courses
            const numSelectedCourses = Object.keys(selectedCourses).length;
            let discountPercentage = 0;

            if (numSelectedCourses === 2) {
                discountPercentage = 5;
            } else if (numSelectedCourses === 3) {
                discountPercentage = 10;
            } else if (numSelectedCourses > 3) {
                discountPercentage = 15;
            }

            const discountAmount = (totalFee * (discountPercentage / 100)).toFixed(2);
            totalFee -= discountAmount;

            // Display discount and bank account information
            discountInfo.textContent = `Discount: ${discountPercentage}%`;
            bankInfo.textContent = "Bank Account Info:\nBank: Absa\nAccount Name: Empowering The Nation\nBranch: 000 000\nAccount Number: 0000 0000";
        }

        // Add event listeners to all course checkboxes
        const courseCheckboxes = document.querySelectorAll("input[type='checkbox']");
        courseCheckboxes.forEach(checkbox => {
            checkbox.addEventListener("change", calculateTotal);
        });

        document.getElementById("checkoutForm").addEventListener("submit", function (event) {
            event.preventDefault();

            // You can add code here to handle form submission, e.g., sending data to a server.
        });
    </script>
